# Keep this network's address out of the stream origins' logs, by sending every upstream
# fetch through a VPN and nothing else through it at all. It changes where requests come
# from, not what may be watched: a stream that will not play in your own browser will not
# play through this either.
#
#   docker compose -f docker-compose.yml -f docker-compose.vpn.yml up -d --build
#
# The tunnel is a sidecar with an HTTP proxy on it, not a network the app is placed
# inside. That is deliberate. This app is fetched *from* as much as it fetches: Safari
# asks it for segments and an Apple TV goes to it directly, so it has to keep a LAN
# address and answer on the LAN -- which `network_mode: service:gluetun` takes away.
# A proxy splits it by destination instead: origins through the tunnel, the house direct.
#
# The sidecar is gluetun, which speaks to most commercial providers; VPN_PROVIDER takes
# any name from its list and defaults to nordvpn. The steps below are Nord's, as the
# worked example. Other providers issue their wireguard key their own way -- gluetun's
# wiki has a page for each.
#
# Nord's wireguard key is Nord's to issue -- `wg genkey` is not it. Nord shows no key in
# the dashboard either; it is behind their API, reached with an access token:
#
#   1. nordaccount.com -> Services -> NordVPN -> Manual setup -> Set up NordVPN manually
#      -> generate a new access token. Copy it once; it is not shown again.
#   2. Ask their API for the key that token belongs to:
#
#        curl -s -u token:<ACCESS_TOKEN> \
#          https://api.nordvpn.com/v1/users/services/credentials |
#          python3 -c "import json,sys; print(json.load(sys.stdin)['nordlynx_private_key'])"
#
#   3. Put it in a .env beside this file (docker compose reads that by itself, and
#      .gitignore already keeps it out of the repo):
#
#        VPN_PROVIDER=nordvpn
#        VPN_PRIVATE_KEY=<the key from step 2>
#        VPN_COUNTRIES=<the country you are in>
#
#      chmod 600 .env -- it is a credential, and the default umask is not.
#
#      Pick the exit nearest you. A distant one makes origins slower and more
#      suspicious, not more permissive, and many tie segment URLs to the address that
#      asked for the page -- which a tunnel on the far side of the world is not.
#
# Under Portainer there is no .env: the same names go in the stack's own environment
# variables, where Portainer keeps them.
#
# OpenVPN with a username and password works too, and skips the API: drop VPN_TYPE and
# WIREGUARD_PRIVATE_KEY, and set OPENVPN_USER / OPENVPN_PASSWORD to the *service*
# credentials on that same manual-setup page, which are not the ones you log in with.
#
# Stacked on docker-compose.bridge.yml instead of on host networking, the app is no
# longer on the host's loopback and cannot reach the published port. Reach the sidecar
# by name over the compose network instead:
#
#   PWS_EGRESS_PROXY=http://gluetun:8888 docker compose \
#     -f docker-compose.yml -f docker-compose.bridge.yml -f docker-compose.vpn.yml up -d

services:
  gluetun:
    image: qmcgaw/gluetun:v3.40.0
    container_name: play-web-stream-vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      # Loopback on purpose. An HTTP proxy published to the LAN is an open relay for
      # anyone on it, and this one has a VPN on the far side of it.
      - "127.0.0.1:8888:8888"
    environment:
      VPN_SERVICE_PROVIDER: "${VPN_PROVIDER:-nordvpn}"
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: "${VPN_PRIVATE_KEY:?set it in .env -- see the header}"
      SERVER_COUNTRIES: "${VPN_COUNTRIES:-}"
      # The proxy the app fetches through. Gluetun's kill switch covers it: with the
      # tunnel down it refuses rather than leaks.
      HTTPPROXY: "on"
      HTTPPROXY_LISTENING_ADDRESS: ":8888"
      # Gluetun answers its own DNS over the tunnel, so name lookups for an origin do
      # not go to the household resolver and describe what is being watched.
      DOT: "on"
    restart: unless-stopped

  play-web-stream:
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      # Named this way rather than as https_proxy: that one is read by every library in
      # the container, the health check included, and it would send 127.0.0.1 down a
      # tunnel that cannot bring it back. This variable is read by the pipeline's own
      # fetches and by nothing else.
      PWS_EGRESS_PROXY: "${PWS_EGRESS_PROXY:-http://127.0.0.1:8888}"
      # On by default whenever the above is set; here to be seen. Off means a stream
      # whose MIME types are already correct is handed to the player as the origin's
      # own URL -- and then the player, or the Apple TV holding that URL, fetches the
      # origin from this network's address and the hiding is over.
      PWS_FORCE_PROXY: "1"
