# Keep this network's address out of stream origins' logs by sending every upstream
# fetch, and nothing else, through a VPN. It changes where requests come from, not what
# can be watched: a stream that will not play in your own browser will not play here.
#
#   docker compose -f docker-compose.yml -f docker-compose.vpn.yml up -d --build
#
# The tunnel is a sidecar running an HTTP proxy. The app is not placed inside its
# network, because the app is fetched from as well as fetching: Safari asks it for
# segments and an Apple TV connects to it directly. It needs a LAN address and must
# answer on the LAN, and `network_mode: service:gluetun` would remove that. The proxy
# splits traffic by destination: origins go through the tunnel, the LAN goes direct.
#
# The sidecar is gluetun, which supports most commercial providers. VPN_PROVIDER takes
# any name from its list and defaults to nordvpn. The steps below are for Nord; other
# providers issue wireguard keys differently, and gluetun's wiki covers each one.
#
# Nord issues the wireguard key itself (`wg genkey` will not work), and the dashboard
# does not show it. Get it from their API with an access token:
#
#   1. nordaccount.com -> Services -> NordVPN -> Manual setup -> Set up NordVPN manually
#      -> generate a new access token. Copy it now; it is only shown once.
#   2. Ask their API for the key that token belongs to:
#
#        curl -s -u token:<ACCESS_TOKEN> \
#          https://api.nordvpn.com/v1/users/services/credentials |
#          python3 -c "import json,sys; print(json.load(sys.stdin)['nordlynx_private_key'])"
#
#   3. Put it in a .env beside this file (docker compose reads it automatically, and
#      .gitignore keeps it out of the repo):
#
#        VPN_PROVIDER=nordvpn
#        VPN_PRIVATE_KEY=<the key from step 2>
#        VPN_COUNTRIES=<the country you are in>
#
#      Run chmod 600 .env. It is a credential and the default umask is too open.
#
#      Pick the exit nearest you. A distant one makes origins slower and more
#      suspicious. Many also tie segment URLs to the address that requested the page,
#      which a far-away exit will not match.
#
# Portainer has no .env: put the same names in the stack's environment variables.
#
# OpenVPN with a username and password also works and skips the API. Drop VPN_TYPE and
# WIREGUARD_PRIVATE_KEY, and set OPENVPN_USER / OPENVPN_PASSWORD to the *service*
# credentials on the same manual-setup page (not your login credentials).
#
# When stacked on docker-compose.bridge.yml instead of host networking, the app is not
# on the host's loopback and cannot reach the published port. Use the sidecar's name
# on the compose network:
#
#   PWS_EGRESS_PROXY=http://gluetun:8888 docker compose \
#     -f docker-compose.yml -f docker-compose.bridge.yml -f docker-compose.vpn.yml up -d

services:
  gluetun:
    image: qmcgaw/gluetun:v3.40.0
    container_name: play-web-stream-vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      # Loopback only. An HTTP proxy published to the LAN is an open relay for anyone
      # on it, and this one exits through a VPN.
      - "127.0.0.1:8888:8888"
    environment:
      VPN_SERVICE_PROVIDER: "${VPN_PROVIDER:-nordvpn}"
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: "${VPN_PRIVATE_KEY:?set it in .env -- see the header}"
      SERVER_COUNTRIES: "${VPN_COUNTRIES:-}"
      # The proxy the app fetches through. Gluetun's kill switch covers it: if the
      # tunnel is down, requests are refused instead of leaking.
      HTTPPROXY: "on"
      HTTPPROXY_LISTENING_ADDRESS: ":8888"
      # Gluetun resolves DNS over the tunnel, so lookups for origins do not go to the
      # household resolver and reveal what is being watched.
      DOT: "on"
    restart: unless-stopped

  play-web-stream:
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      # Not https_proxy: every library in the container reads that, including the
      # health check, which would send 127.0.0.1 down a tunnel that cannot return it.
      # Only the pipeline's own fetches read this variable.
      PWS_EGRESS_PROXY: "${PWS_EGRESS_PROXY:-http://127.0.0.1:8888}"
      # On by default whenever the above is set; listed here for visibility. If off, a
      # stream with correct MIME types is handed to the player as the origin's own URL.
      # The player, or the Apple TV holding that URL, then fetches from this network's
      # address and the origin sees it.
      PWS_FORCE_PROXY: "1"
