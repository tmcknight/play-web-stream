<div class="wrap">
  <header class="top">
    <a class="brand" href="#"><span class="mark"><svg class="ico" aria-hidden="true"><use href="#i-play"/></svg></span>Play</a>
    <a class="pill" id="tvpill" href="#tvs"><span class="dot" id="tvdot"></span><span class="lbl" id="tvlbl">TVs</span></a>
  </header>

  <div class="home" id="home">
    <div class="col">
      <div id="hero">
        <h1>What are we watching?</h1>
        <p class="lede">Paste the link to a page with a video player. It comes back ready for
          your Apple TV, AirPlay and fullscreen.</p>
      </div>

      <form id="f">
        <label class="fieldlabel" for="url">Page link</label>
        <div class="field">
          <input type="url" id="url" placeholder="https://…" required
                 autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
          <button type="button" class="iconbtn" id="clear" aria-label="Clear the link" hidden><svg class="ico" aria-hidden="true"><use href="#i-x-mark"/></svg></button>
          <button class="btn primary" id="go"><span class="lbl">Find video</span></button>
        </div>
      </form>
      <div class="below">
        <span>No link handy? <a href="#" id="sample">Try a sample stream</a></span>
        <details id="opts">
          <summary><svg class="ico" aria-hidden="true"><use href="#i-chevron-right"/></svg>Options</summary>
          <label class="opt"><input type="checkbox" id="browser" checked>
            <span>If the page has no playlist, open it in a headless browser as well. Slower,
              but finds players built as the page loads.</span></label>
        </details>
      </div>
      <p class="warn" id="full" hidden></p>
      <p class="note" id="egress" hidden></p>

      <!-- Polite, so a screen reader announces each stage and the verdict without
           cutting one off with the next. -->
      <section id="out" aria-live="polite"></section>
    </div>

    <section id="streamsWrap" hidden>
      <div class="sechead"><h2 class="sec">On now</h2><span class="muted" id="count"></span></div>
      <div class="list" id="streams"></div>
    </section>
  </div>

  <div class="tvs" id="tvsView" hidden>
    <a class="back" href="#"><svg class="ico" aria-hidden="true"><use href="#i-chevron-left"/></svg>Back</a>
    <div>
      <h1>TVs</h1>
      <p class="lede">Apple TVs on this network. Pair one once and it stays paired.</p>
    </div>
    <div class="stack" id="airplay"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// esc() makes a string safe as text or in a quoted attribute, but not as a link:
// "javascript:..." passes through unchanged. Every href here comes from a resolved
// playlist URL, so anything other than http(s) is an upstream error and becomes "#".
const href = (s) => /^https?:\/\//i.test(String(s ?? "")) ? esc(s) : "#";

const ico = (name) => `<svg class="ico" aria-hidden="true"><use href="#i-${name}"/></svg>`;

// A labelled control's content: the icon, then the text in its own span. Button text
// changes often ("Copy" to "Copied", a receiver's name to "Starting…"), and setting
// textContent would remove the icon. All labels go through setLabel(), which keeps the
// icon named in data-icon.
const withIcon = (icon, text) => (icon ? ico(icon) : "") + `<span class="lbl">${esc(text)}</span>`;

function setLabel(el, text, icon) {
  if (icon !== undefined) el.dataset.icon = icon || "";
  el.innerHTML = withIcon(el.dataset.icon || "", text);
}

// A control's current text without the icon. Used with setLabel() to restore a label.
const labelOf = (el) => el.textContent.trim();

// navigator.clipboard only exists in a secure context (HTTPS or localhost). This app
// is reached over plain HTTP on a LAN address, so on every device but the host it is
// missing. Fall back to the older selection-based copy, which works without it.
async function copyText(text) {
  if (window.isSecureContext && navigator.clipboard) {
    await navigator.clipboard.writeText(text);
    return;
  }
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, ta.value.length);   // iOS Safari ignores select() alone
  let ok = false;
  try { ok = document.execCommand("copy"); } finally { ta.remove(); }
  if (!ok) throw new Error("execCommand(copy) was refused");
}

// Report the reason, because a refused clipboard and a missing one are different
// problems.
async function copyInto(btn, text, idle) {
  try {
    await copyText(text);
    setLabel(btn, "Copied", "check");
    btn.title = "";
  } catch (e) {
    setLabel(btn, "Copy failed", "exclamation-triangle");
    btn.title = String((e && e.message) || e);
  }
  setTimeout(() => { setLabel(btn, idle, "clipboard-document"); btn.title = ""; }, 1500);
}

// localStorage is only a per-viewer convenience. In a private window it can be
// missing, and on some phones reading it throws instead of returning null, so every
// access is wrapped and the page works the same without it.
function remember(key, value) {
  try { localStorage.setItem("pws." + key, value); } catch (e) { /* ignore */ }
}
function remembered(key) {
  try { return localStorage.getItem("pws." + key); } catch (e) { return null; }
}

// A test playlist that is always up and needs no resolving. It separates a receiver
// that will not play from a site whose stream never arrived. Apple hosts it as their
// HLS example, so it is more reliable than most test URLs.
const SAMPLE = "https://devstreaming-cdn.apple.com/videos/streaming/examples/bipbop_4x3/bipbop_4x3_variant.m3u8";

// Resolve straight away. There is nothing to type, and focusing the field would open
// a keyboard over the result card.
$("sample").addEventListener("click", (ev) => {
  ev.preventDefault();
  $("url").value = SAMPLE;
  syncClear();
  startResolve(SAMPLE);
});

if (remembered("opts") === "1") $("opts").open = true;
$("opts").addEventListener("toggle", () => remember("opts", $("opts").open ? "1" : "0"));

// --------------------------------------------------------------------------- views

// Two screens: the home screen and TVs. The hash picks one, so the phone's back
// gesture returns from TVs as people expect.
function route() {
  const tvs = location.hash === "#tvs";
  $("home").hidden = tvs;
  $("tvsView").hidden = !tvs;
  window.scrollTo(0, 0);
  if (tvs) renderAirplay();
}
addEventListener("hashchange", route);

// The clear button is only there when there is something to clear.
function syncClear() { $("clear").hidden = !$("url").value; }
$("url").addEventListener("input", syncClear);
$("clear").addEventListener("click", () => {
  $("url").value = "";
  syncClear();
  $("url").focus();
});

// --------------------------------------------------------------------------- resolving

// The server's progress lines are written for someone reading the log. This card is
// read by someone holding a phone in front of a TV, so the lines are translated.
// Unmapped lines are shown unchanged.
const STAGE_TEXT = {
  "reading page HTML": "Reading the page",
  "no playlist in the HTML -- launching headless browser":
    "Player is built as the page loads. Opening it in a browser, up to 30 seconds",
  "checking segment MIME types": "Checking the video",
  "starting the proxy": "Getting it ready",
  "playlist given directly": "That is the video itself",
  "the origin refused Python's TLS handshake -- presenting Safari's instead":
    "The site refused us, so trying again as Safari",
  "loading page in chromium": "Loading the page in the browser",
  "confirmed from a network response": "Caught the video the player asked for",
};

function stageText(raw) {
  if (STAGE_TEXT[raw]) return STAGE_TEXT[raw];
  // Two of the browser's lines include a count, so they are matched by pattern.
  let m = /^scraping (\d+) frame/.exec(raw);
  if (m) return `Reading ${m[1]} frame${m[1] === "1" ? "" : "s"} of the page`;
  m = /^verifying (\d+) scraped candidate/.exec(raw);
  if (m) return `Checking ${m[1]} possible video${m[1] === "1" ? "" : "s"}`;
  return raw;
}

let source = null;
let busy = false;
let lastTried = "";

function setBusy(on) {
  busy = on;
  $("go").innerHTML = on
    ? `<span class="spin"></span><span class="lbl">Finding\u2026</span>`
    : `<span class="lbl">Find video</span>`;
  // Capacity also disables this button, and the ten-second refresh can run during a
  // resolve, so both conditions are checked here every time.
  $("go").disabled = on || full;
  setTitle();
}

// The tab title shows whether a resolve is running and how many streams are active,
// for when the page is in a background tab.
function setTitle() {
  const running = rows.size;
  document.title = busy ? "Finding video\u2026 \u00b7 Play web stream"
    : running ? `\u25b6 ${running} on \u00b7 Play web stream`
    : "Play web stream";
}

// The card is built once per resolve and gains a line per stage. Rebuilding it each
// time moved focus off Cancel and made screen readers restart the list. Finished
// stages get a check; the current one gets the accent dot.
function beginProgress() {
  lastResult = null;
  $("out").innerHTML = `
    <div class="card progress">
      <svg class="ring" viewBox="0 0 56 56" fill="none" aria-hidden="true">
        <circle class="track" cx="28" cy="28" r="24" stroke-width="5"/>
        <path class="arc" d="M28 4a24 24 0 0 1 24 24" stroke-width="5" stroke-linecap="round"/>
      </svg>
      <h2 class="title">Finding the video</h2>
      <ol class="steps" id="stages"></ol>
      <div id="ptail"><button class="btn" id="cancel">Cancel</button></div>
    </div>`;
  $("cancel").onclick = () => {
    stop();
    endProgress(`<p class="body">Cancelled.</p>`);
  };
}

function finishStage(line) {
  line.className = "done";
  line.innerHTML = ico("check") + `<span>${esc(line.dataset.text)}</span>`;
}

function addStage(text) {
  const list = $("stages");
  if (!list) return;
  const now = list.querySelector(".now");
  if (now) finishStage(now);
  const line = document.createElement("li");
  line.className = "now";
  line.dataset.text = text;
  line.innerHTML = `<span class="pip"></span><span>${esc(text)}</span>`;
  list.appendChild(line);
}

// `tail` is how the run ended: a cancellation, or a lost connection with a way to
// retry. It replaces Cancel, and the ring stops.
function endProgress(tail) {
  const now = $("stages") && $("stages").querySelector(".now");
  if (now) finishStage(now);
  const ring = $("out").querySelector(".ring");
  if (ring) ring.style.animation = "none";
  if ($("ptail")) $("ptail").innerHTML = tail;
  const retry = $("retry");
  if (retry) retry.onclick = () => startResolve(lastTried);
}

function stop() {
  if (source) source.close();
  source = null;
  setBusy(false);
}

function startResolve(url) {
  if (!url || full) return;
  lastTried = url;
  // type=url accepts any scheme, and the server answers non-http(s) with a plain 400.
  // EventSource reports that as a dropped connection and offers a Retry that will fail
  // again, so catch it here and explain.
  if (!/^https?:\/\//i.test(url)) {
    stop();
    showError({error: "That is not a web address",
               hint: "Give a link starting with http:// or https://."});
    return;
  }
  stop();
  remember("url", url);
  setBusy(true);
  beginProgress();
  addStage("Starting");

  const q = new URLSearchParams({url, browser: $("browser").checked ? "1" : "0"});
  source = new EventSource("/api/resolve?" + q);

  source.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.stage) { addStage(stageText(msg.stage)); return; }
    stop();
    if (msg.error) showError(msg); else showResult(msg.done);
    loadStreams();
  };
  source.onerror = () => {
    stop();
    endProgress(`<div class="stack"><p class="body">Lost the connection to the app.</p>
      <button class="btn primary wide" id="retry">${withIcon("arrow-path", "Try again")}</button></div>`);
  };
}

$("f").addEventListener("submit", (ev) => {
  ev.preventDefault();
  startResolve($("url").value.trim());
});

// Pasting a whole link is the usual way in on a phone, and the next tap is always
// Find video, so a paste that replaces the field starts it. Typing still waits for
// the button. The value is read after the paste has landed.
$("url").addEventListener("paste", (ev) => setTimeout(() => {
  syncClear();
  const pasted = ((ev.clipboardData && ev.clipboardData.getData("text")) || "").trim();
  const url = $("url").value.trim();
  if (!busy && url === pasted && /^https?:\/\/\S+$/i.test(url)) {
    $("url").blur();       // closes the phone keyboard over the progress card
    startResolve(url);
  }
}, 0));

// The server's message is one sentence with detail after a dash, which is hard to
// read on a phone. Split at the dash: the problem becomes the title, and the detail
// goes below with the hint.
function showError(msg) {
  lastResult = null;
  const raw = String(msg.error || "That did not work.");
  const cut = raw.indexOf(" -- ");
  const title = cut > 0 ? raw.slice(0, cut) : raw;
  const detail = cut > 0 ? raw.slice(cut + 4) : "";
  const hint = String(msg.hint || "");
  // Each hint that names a next step gets a button for it, so nobody on a phone has
  // to find the option or the field the hint describes.
  const offerPaste = /paste the page URL/i.test(hint);
  const offerBrowser = /browser fallback/i.test(hint) && !$("browser").checked;
  // A stream that is not live yet, or a flaky origin, often works a minute later.
  const offerRetry = /^https?:\/\//i.test(lastTried) && !offerBrowser;
  const actions = [
    offerBrowser ? `<button class="btn primary big wide" id="withBrowser">${
      withIcon("arrow-path", "Look harder with a browser")}</button>` : "",
    offerRetry ? `<button class="btn primary big wide" id="retry">${
      withIcon("arrow-path", "Try again")}</button>` : "",
    offerPaste
      ? `<button class="btn wide" id="paste">${withIcon("pencil-square", "Use the page link instead")}</button>`
      : `<button class="btn wide" id="another">Try a different link</button>`,
  ].join("");
  $("out").innerHTML = `
    <div class="card err">
      <span class="badge bad">${ico("magnifying-glass")}</span>
      <h2 class="title">${esc(title)}</h2>
      ${detail ? `<p class="body">${esc(detail[0].toUpperCase() + detail.slice(1))}</p>` : ""}
      ${hint ? `<p class="body">${esc(hint)}</p>` : ""}
      <div class="stack">${actions}</div>
      ${lastTried ? `<div class="tried">Tried <code>${esc(lastTried)}</code></div>` : ""}
    </div>`;
  const edit = () => { $("url").focus(); $("url").select(); };
  if ($("paste")) $("paste").onclick = edit;
  if ($("another")) $("another").onclick = edit;
  if ($("retry")) $("retry").onclick = () => startResolve(lastTried);
  // Ticks the option as well, so the next resolve by hand keeps it.
  if ($("withBrowser")) $("withBrowser").onclick = () => {
    $("browser").checked = true;
    startResolve(lastTried);
  };
}

// What the proxy did, in words for someone who does not know what a MIME type is.
// The technical lines stay below it for debugging.
function whatWeDid(r) {
  const said = [];
  if (!r.needs_proxy) {
    said.push("Nothing needed fixing, so the TV plays the site\u2019s own link.");
  } else if (r.mime && r.mime.served_as !== r.mime.really_is && r.mime.really_is) {
    said.push(`The site labels its video as ${r.mime.served_as}, which Apple devices refuse. `
              + "This app relabels it on the way through.");
  } else if (r.referer) {
    said.push("The site only serves its video to its own pages, and Safari will not say "
              + "which page it came from. This app asks on its behalf.");
  } else {
    said.push("The privacy proxy is on, so the video is fetched through it instead of by "
              + "the TV.");
  }
  if (r.handshake === "browser") {
    said.push("The site turned away ordinary connections, so this app connects the way "
              + "Safari does.");
  }
  if (r.needs_proxy) {
    said.push("It also keeps a longer buffer, so a slow connection does not fall off the "
              + "end of a live stream.");
  }
  return said.join(" ");
}

function showResult(r) {
  lastResult = r;
  const where = r.needs_proxy
    ? (r.reused ? "already running here" : "through this app")
    : "direct from the site";
  $("out").innerHTML = `
    <div class="card">
      <div class="readybody">
        ${r.qr ? `<figure class="qrwrap"><div class="qr" role="img"
            aria-label="QR code for the playback link">${r.qr}</div>
            <figcaption>Scan to open on a phone</figcaption></figure>` : ""}
        <div class="readymain">
          <div class="headline">
            <span class="badge good">${ico("check")}</span>
            <div><h2 class="title">Ready to watch</h2>
              <div class="sub">${esc(hostOf(r.playlist))} \u00b7 ${esc(where)}</div></div>
          </div>
          <div class="stack cast" data-cast></div>
          <div class="duo">
            <a class="btn" data-here href="${href(r.playback_url)}" target="_blank" rel="noopener"
               title="Opens in Safari's own player, with AirPlay and fullscreen">${
              withIcon("device-phone", "Play here")}</a>
            <button class="btn" id="copy" data-icon="clipboard-document">${
              withIcon("clipboard-document", "Copy link")}</button>
          </div>
          <a class="linkbtn" href="#tvs" data-setup hidden>Set up a TV to play on it</a>
          <div class="stack" data-warns></div>
        </div>
      </div>
      <details class="fold">
        <summary>${ico("chevron-right")}What this app did</summary>
        <div class="pad">
          <p class="body">${esc(whatWeDid(r))}</p>
          <dl>
            <dt>Playback</dt><dd><a class="urlbox" href="${href(r.playback_url)}">${esc(r.playback_url)}</a></dd>
            <dt>Found</dt><dd>${esc({html:"in the page HTML",browser:"with the headless browser",direct:"given directly"}[r.method] || r.method)}</dd>
            <dt>Playlist</dt><dd>${esc(r.playlist)}</dd>
            <dt>Referer</dt><dd>${esc(r.referer || "(not required)")}</dd>
            ${r.handshake === "browser" ? `<dt>Handshake</dt><dd>Safari's, via curl_cffi</dd>` : ""}
            <dt>Segments</dt><dd>served as ${esc(r.mime.served_as)}, really ${esc(r.mime.really_is)}</dd>
            <dt>Why</dt><dd>${esc(r.reason)}</dd>
          </dl>
        </div>
      </details>
    </div>`;
  const copy = $("copy");
  if (copy) copy.onclick = () => copyInto(copy, r.playback_url, "Copy link");
  cardSig = null;
  syncCard();
}

// The card's AirPlay buttons and warnings follow the same state as the stream's row,
// and are rebuilt only when that state changes, so a button reading "Starting…" is not
// reset under the finger. A stream that needed no proxy sends its origin URL with the
// buttons, because with no proxy running the server has no instance to look it up in.
let cardSig = null;
function syncCard() {
  const r = lastResult;
  const cast = $("out").querySelector("[data-cast]");
  if (!r || !cast) return;
  const picker = airplayPicker(r.playlist, r.needs_proxy ? "" : r.playback_url, true);
  const warns = warnsFor(r.playlist);
  const sig = picker + "\u0000" + warns;
  if (sig === cardSig) return;
  cardSig = sig;
  cast.innerHTML = picker;
  cast.querySelectorAll("[data-airplay]").forEach(bindAirplay);
  $("out").querySelector("[data-warns]").innerHTML = warns;
  // With no TV to send to, playing here is the main action, so it takes the accent.
  $("out").querySelector("[data-here]").classList.toggle("primary", !picker);
  $("out").querySelector("[data-setup]").hidden =
    !(airplayAvailable && !airplayReceivers.some(x => x.paired));
}

// --------------------------------------------------------------------------- streams

// One fetch returns all AirPlay state: whether pyatv is installed, which receivers
// answered, which are paired, what each is playing, and whether a pairing is in
// progress, so a reload resumes where it left off. `scan` is the slow path and only
// the button passes it.
async function refreshAirplay(scan) {
  let a = {};
  try {
    a = await (await fetch("/api/airplay" + (scan ? "?scan=1" : ""))).json();
  } catch (e) { a = {error: String(e)}; }
  airplayAvailable = Boolean(a.available);
  airplayReceivers = a.receivers || [];
  airplaySessions = a.sessions || {};
  airplayPairing = a.pairing || null;
  if (a.error) pairError = a.error;
  renderAirplay();
  syncCard();
}

let full = false;

function applyCapacity(cap) {
  if (!cap) return;
  full = cap.used >= cap.limit;
  $("count").textContent = cap.used + " of " + cap.limit;
  $("full").hidden = !full;
  $("full").innerHTML = full
    ? withIcon("exclamation-triangle",
               `All ${cap.limit} stream${cap.limit === 1 ? "" : "s"} are running. `
               + "Stop one under On now to start another.")
    : "";
  // The limit is the published port range; a further stream would serve on a port
  // nothing can reach. The page does not need to explain that.
  $("full").title = "The limit is the range of ports published to this machine.";
  $("go").disabled = full || busy;
}

async function loadStreams() {
  let streams = [], capacity = null;
  try {
    const body = await (await fetch("/api/streams")).json();
    streams = body.streams; capacity = body.capacity;
  } catch (e) { return; }
  applyCapacity(capacity);
  // Each stream includes the receivers playing it. Otherwise the picker only knew
  // /api/airplay's answer from the last tap, so a finished TV or a hand-off from
  // another phone left the toggle showing the wrong state until a reload.
  for (const s of streams) {
    if (Array.isArray(s.airplay)) airplaySessions[s.source] = s.airplay;
  }
  $("streamsWrap").hidden = streams.length === 0;
  syncRows(streams);
  syncCard();
  renderPill();
  setTitle();
}

// Rows are keyed by source and survive the ten-second refresh; only their text
// changes. Rebuilding the list lost open logs and their scroll position, buttons
// reading "Starting…", focus, and open Details.
const rows = new Map();
let logSeq = 0;

function syncRows(streams) {
  const seen = new Set();
  for (const s of streams) {
    seen.add(s.source);
    let row = rows.get(s.source);
    if (!row) {
      row = buildRow(s);
      rows.set(s.source, row);
      $("streams").appendChild(row.el);
    }
    updateRow(row, s);
  }
  for (const [src, row] of [...rows]) {
    if (!seen.has(src)) { row.el.remove(); rows.delete(src); retire(src); }
  }
}

// When a stream stops (by the button or its idle timeout), the card above still shows
// its URL, which no longer works. Mark it as stopped and offer to start it again.
function retire(source) {
  if (!lastResult || !lastResult.needs_proxy || lastResult.playlist !== source) return;
  lastResult = null;
  $("out").innerHTML = `
    <div class="card">
      <span class="badge dim">${ico("stop-circle")}</span>
      <h2 class="title">That stream has stopped</h2>
      <p class="body">Its link no longer plays. Streams stop by themselves once nobody
        has watched them for a while.</p>
      ${lastTried ? `<button class="btn primary big wide" id="again">${
          withIcon("arrow-path", "Find it again")}</button>` : ""}
    </div>`;
  const again = $("again");
  if (again) again.onclick = () => startResolve(lastTried);
}

function buildRow(s) {
  const el = document.createElement("div");
  el.className = "item";
  const logId = "log-" + (++logSeq);
  el.innerHTML = `
    <div class="itemtop">
      <span class="tile">${ico("play")}</span>
      <div class="itemtext">
        <div class="who"></div>
        <div class="state"></div>
      </div>
      <button class="btn small stopbtn" data-icon="stop">${withIcon("stop", "Stop")}</button>
    </div>
    <div class="acts ap"></div>
    <div class="stack warns"></div>
    <details class="more">
      <summary>${ico("chevron-right")}Details</summary>
      <div class="pad">
        <div class="kv">
          <span>Playback</span><a class="urlbox pb" target="_blank" rel="noopener"></a>
          <span>Source</span><code class="src"></code>
          <span>Player</span><code class="rawplayer"></code>
        </div>
        <div class="acts">
          <button class="btn small copybtn" data-icon="clipboard-document">${
            withIcon("clipboard-document", "Copy link")}</button>
          <button class="btn small logbtn" data-icon="document-text">${
            withIcon("document-text", "Show log")}</button>
        </div>
        <pre class="log" id="${logId}" hidden></pre>
      </div>
    </details>`;
  const q = (sel) => el.querySelector(sel);
  const row = {
    el, source: s.source, url: s.url, apSig: null,
    tile: q(".tile"), who: q(".who"), state: q(".state"), warns: q(".warns"),
    pb: q(".pb"), src: q(".src"), rawplayer: q(".rawplayer"),
    more: q(".more"), log: q("#" + logId), ap: q(".ap"),
    logBtn: q(".logbtn"), copyBtn: q(".copybtn"), stop: q(".stopbtn"),
  };
  bindRow(row);
  return row;
}

function bindRow(row) {
  row.logBtn.onclick = async () => {
    if (openLogs.has(row.source)) {
      openLogs.delete(row.source);
      row.log.hidden = true;
      setLabel(row.logBtn, "Show log", "document-text");
      return;
    }
    openLogs.add(row.source);
    setLabel(row.logBtn, "Hide log", "eye-slash");
    await fillLog(row);
  };

  row.copyBtn.onclick = () => copyInto(row.copyBtn, row.url, "Copy link");

  row.stop.onclick = () => arm(row.stop, "Stop?", async () => {
    row.stop.disabled = true;
    try {
      await fetch("/api/stop", {method: "POST", headers: {"Content-Type": "application/json"},
                                body: JSON.stringify({source: row.source})});
    } finally {
      row.stop.disabled = false;         // a stop that failed leaves a usable button
    }
    loadStreams();
  });
}

// One line saying what the stream is doing, most useful fact first: a TV it was sent
// to, then what the Safari player last reported, then that nothing is watching yet.
function rowState(s) {
  const tvs = (airplaySessions[s.source] || []).map(x => x.device);
  if (tvs.length) return {text: "On " + tvs.join(" and "), good: true};
  const human = humanPlayer(s.player);
  if (human) return {text: human, good: /^Playing/.test(human)};
  return {text: "Ready. Nothing is watching it yet.", good: false};
}

function updateRow(row, s) {
  const who = hostOf(s.source);
  if (row.who.textContent !== who) row.who.textContent = who;
  row.url = s.url;
  if (row.pb.textContent !== s.url) { row.pb.textContent = s.url; row.pb.href = href(s.url); }
  row.src.textContent = s.source;

  const st = rowState(s);
  if (row.state.textContent !== st.text) row.state.textContent = st.text;
  row.state.classList.toggle("good", st.good);
  row.tile.classList.toggle("good", st.good);
  row.rawplayer.textContent = (s.player || "").trim() || "(nothing reported yet)";

  const warns = warnsFor(s.source);
  if (row.warns.innerHTML !== warns) row.warns.innerHTML = warns;

  // Rebuild the picker only when it has changed. Rebuilding it every time reset a
  // button reading "Starting…" a second after it was tapped.
  const ap = airplayPicker(s.source, "", false);
  if (row.apSig !== ap) {
    row.apSig = ap;
    row.ap.innerHTML = ap;
    row.ap.querySelectorAll("[data-airplay]").forEach(bindAirplay);
  }

  if (openLogs.has(s.source)) {
    row.log.hidden = false;
    setLabel(row.logBtn, "Hide log", "eye-slash");
    fillLog(row);
  }
}

// Streams are labelled with the source site, which distinguishes them at a glance and
// fits on a phone screen.
function hostOf(url) {
  try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e) { return url; }
}

// The player page's report, as a readable line. The raw line stays in Details, because
// its fields are useful for debugging a stream.
const PLAYER_EVENT = {
  playing: "Playing", play: "Playing", tick: "Playing", canplay: "Ready to play",
  loadedmetadata: "Loading", waiting: "Buffering", stalled: "Buffering",
  suspend: "Waiting", pause: "Paused", ended: "Finished", emptied: "Stopped",
  error: "The player reported an error", "airplay-changed": "AirPlay route changed",
};

function humanPlayer(line) {
  const m = /\[player\]\s+(\S+)\s*(.*)$/.exec(line || "");
  if (!m) return "";
  const fields = {};
  m[2].trim().split(/\s+/).forEach(pair => {
    const i = pair.indexOf("=");
    if (i > 0) fields[pair.slice(0, i)] = pair.slice(i + 1);
  });
  let what = PLAYER_EVENT[m[1]] || m[1];
  if (fields.paused === "1" && m[1] !== "error") what = "Paused";
  if (fields.air === "1") what += " on an AirPlay receiver";
  const at = Number(fields.t);
  const where = Number.isFinite(at) && at > 0
    ? `${Math.floor(at / 60)}:${String(Math.floor(at % 60)).padStart(2, "0")} in` : "";
  // The timestamp is from the proxy's clock, not this phone's, and the two may differ.
  // So it is shown as a time, not as "3 seconds ago".
  const stamp = /^(\d\d:\d\d:\d\d)/.exec(line);
  return [what, where, stamp ? "last heard " + stamp[1] : ""].filter(Boolean).join(" \u00b7 ");
}

// The full proxy log, not just the [player] lines the row shows. When a stream will
// not start, the reason is usually elsewhere in the log.
const openLogs = new Set();

async function fillLog(row) {
  row.log.hidden = false;
  // Refilling resets the scroll position. Only follow the end if the user was
  // already scrolled to it.
  const atEnd = row.log.scrollTop + row.log.clientHeight >= row.log.scrollHeight - 4;
  const place = row.log.scrollTop;
  let text;
  try {
    const r = await (await fetch("/api/log?player=0&source=" + encodeURIComponent(row.source))).json();
    text = (r.lines || []).join("\n") || "(nothing logged yet)";
  } catch (e) {
    text = String((e && e.message) || e);
  }
  if (row.log.textContent === text) return;
  row.log.textContent = text;
  row.log.scrollTop = atEnd ? row.log.scrollHeight : place;
}

// Errors are kept in state, not on the button. The card is re-rendered every few
// seconds, which cleared messages on buttons before anyone could read them.
//
// Keyed by stream and receiver, because a receiver can pair and then refuse the
// hand-off. With one message per stream, a working TV's row could hide another's
// error.
const actionErrors = new Map();
const errorKey = (source, receiver) => source + "\u0000" + (receiver || "");
const errorsFor = (source) => [...actionErrors]
  .filter(([key]) => key.slice(0, key.indexOf("\u0000")) === source)
  .map(([, message]) => message);
const warnsFor = (source) => errorsFor(source)
  .map(m => `<p class="warn">${withIcon("exclamation-triangle", m)}</p>`).join("");

// A destructive tap asks for confirmation in the button label instead of a dialog,
// which is awkward on a phone. The label resets after a moment, so a page left in a
// pocket is not one tap from stopping a stream an hour later.
function arm(button, question, run) {
  if (button.dataset.armed === "1") {
    disarm(button);
    run();
    return;
  }
  button.dataset.armed = "1";
  button.classList.add("armed");
  button.dataset.idle = labelOf(button);
  setLabel(button, question);
  button.dataset.timer = String(setTimeout(() => disarm(button), 3000));
}

function disarm(button) {
  if (button.dataset.armed !== "1") return;
  clearTimeout(Number(button.dataset.timer));
  setLabel(button, button.dataset.idle || labelOf(button));
  button.dataset.armed = "";
  button.classList.remove("armed");
}

// --------------------------------------------------------------------------- AirPlay

// Paired receivers that answered, the one used last first, so the big button on the
// ready card is the TV this household usually watches on.
function usableReceivers() {
  const last = remembered("tv");
  return airplayReceivers
    .filter(receiver => receiver.paired && receiver.seen)
    .sort((a, b) => (b.address === last) - (a.address === last));
}

// One Stop per receiver already playing this stream, and one button per other usable
// receiver. Sessions are per (stream, receiver), so two TVs showing the same stream
// get two buttons. A remembered receiver that did not answer gets no button, because
// the server would refuse the hand-off; it is still listed under TVs.
//
// `big` is the ready card: the first TV is the page's main action. Rows get compact
// buttons.
function airplayPicker(source, url, big) {
  if (!airplayAvailable) return "";
  const live = (airplaySessions[source] || []);
  const playing = new Set(live.map(session => session.address));
  const size = big ? "wide" : "small";
  const stop = live.map(session => airplayButton(source, url, session.address,
    "Stop on " + session.device, true, `btn ${size} danger`));
  const start = usableReceivers()
    .filter(receiver => !playing.has(receiver.address))
    .map((receiver, i) => airplayButton(source, url, receiver.address,
      big ? "Play on " + receiver.name : receiver.name, false,
      big && i === 0 && !live.length ? "btn primary big wide" : `btn ${size}`));
  return stop.concat(start).join("");
}

function airplayButton(source, url, address, label, on, cls) {
  return `<button class="${cls}" data-icon="airplay" data-airplay="${esc(source)}"
    data-receiver="${esc(address)}" data-on="${on ? "1" : ""}"${
    url ? ` data-url="${esc(url)}"` : ""}>${withIcon("airplay", label)}</button>`;
}

// The hand-off keeps a session open, so the button toggles it on and off for that
// receiver.
function bindAirplay(button) {
  button.onclick = async () => {
    const source = button.dataset.airplay;
    const receiver = button.dataset.receiver;
    const on = button.dataset.on === "1";
    const idle = labelOf(button);
    actionErrors.delete(errorKey(source, receiver));
    button.disabled = true;
    setLabel(button, on ? "Stopping\u2026" : "Starting\u2026");
    let res = {};
    try {
      res = await (await fetch("/api/airplay", {method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({action: on ? "stop" : "start", source, receiver,
                              url: button.dataset.url || ""})})).json();
    } catch (e) { res = {error: String(e)}; }
    if (res.error) actionErrors.set(errorKey(source, res.receiver || receiver), res.error);
    else if (!on) remember("tv", receiver);
    // Rows survive a refresh, so a failed hand-off would leave "Starting…" on this
    // button indefinitely. Restore it; a successful hand-off rebuilds the picker anyway.
    button.disabled = false;
    setLabel(button, idle);
    await refreshAirplay();
    loadStreams();
  };
}

// The header pill names the TV the big button would use, so the page says up front
// whether a tap will reach the television.
function renderPill() {
  const usable = usableReceivers();
  let text = "TVs", dot = "";
  if (airplayAvailable && usable.length) {
    text = usable[0].name + (usable.length > 1 ? ` +${usable.length - 1}` : "");
    dot = "good";
  } else if (airplayAvailable && !airplayReceivers.some(r => r.paired)) {
    text = "Set up a TV";
    dot = "accent";
  }
  $("tvlbl").textContent = text;
  $("tvdot").className = "dot " + dot;
  $("tvpill").setAttribute("aria-label", "TVs: " + text);
}

// A remembered receiver is listed whatever the scan found, so the row shows its state:
// ready, not answering, or reset and no longer paired.
function receiverState(receiver) {
  if (!receiver.seen) return {cls: "", text: "Not answering. Is it asleep?", pair: false};
  if (receiver.paired) return {cls: "good", text: "Ready", pair: false};
  if (receiver.remembered) return {cls: "bad", text: "Not paired any more", pair: "Pair again"};
  return {cls: "", text: "Found on the network", pair: "Pair"};
}

// available:false means either pyatv is missing on the server, or the server will not
// allow AirPlay from this client (loopback, or outside the advertised LAN). The page
// can detect loopback itself, so it names that case.
function airplayOff() {
  const here = location.hostname;
  if (here === "localhost" || here === "127.0.0.1" || here === "::1" || here === "[::1]") {
    return "This is the machine running the app, so sending to a TV is off here. "
         + "Open this page from a phone on the same Wi-Fi to send a stream to a TV.";
  }
  return "Sending to a TV is off: pyatv is not installed on the server, or this device "
       + "is not on the network the app advertises.";
}

// The TVs screen. Pairing is needed after a fresh deploy before AirPlay works, and
// takes two requests, because the receiver shows its PIN only after pairing starts.
// The server's `pairing` says which state to show after a reload.
function renderAirplay() {
  renderPill();
  if (!airplayAvailable) {
    $("airplay").innerHTML = `<div class="card"><p class="note">${ico("no-symbol")}<span>${
      esc(airplayOff())}</span></p></div>`;
    return;
  }
  const list = airplayReceivers.map(receiver => {
    const st = receiverState(receiver);
    return `
    <div class="item">
      <div class="itemtop">
        <span class="tile${st.cls === "good" ? " good" : ""}">${ico("tv")}</span>
        <div class="itemtext">
          <div class="who">${esc(receiver.name)}</div>
          <div class="state ${st.cls}">${esc(st.text)}</div>
          <code class="addr">${esc(receiver.address)}</code>
        </div>
        <div class="acts">
          ${st.pair ? `<button class="btn small primary" data-icon="link" data-pair="${esc(receiver.address)}">${
            withIcon("link", st.pair)}</button>` : ""}
          ${receiver.remembered
            ? `<button class="btn small" data-icon="trash" data-forget="${esc(receiver.address)}">${
                withIcon("trash", "Forget")}</button>` : ""}
        </div>
      </div>
    </div>`;
  }).join("");

  // A refresh rewrites this card, PIN field included, so save a half-typed PIN first.
  const typed = $("pin") ? $("pin").value : "";
  const pairing = airplayPairing ? `
    <div class="card pair stack">
      <span class="eyebrow">Pairing</span>
      <h2 class="title">Pair with ${esc(airplayPairing.device)}</h2>
      <p class="body">Type the code showing on the TV.</p>
      <input class="pin" type="text" id="pin" inputmode="numeric" autocomplete="one-time-code"
             enterkeyhint="done" aria-label="Code shown on ${esc(airplayPairing.device)}">
      <div class="duo">
        <button class="btn" id="pinNo">Not now</button>
        <button class="btn primary" id="pinOk">Pair</button>
      </div>
    </div>` : "";

  $("airplay").innerHTML = pairing
    + (list ? `<div class="list">${list}</div>`
            : `<div class="card"><p class="body">No Apple TV has answered yet. Look for one
                on the network below, or name its address in PWS_AIRPLAY_HOST on the
                server.</p></div>`)
    + (pairError ? `<p class="warn">${withIcon("exclamation-triangle", pairError)}</p>` : "")
    + `<div class="sweep">
         <button class="btn" id="apscan" data-icon="magnifying-glass">${
           withIcon("magnifying-glass", "Look for more TVs")}</button>
         <span class="muted">Tries every address on this network. Up to a minute.</span>
         <details>
           <summary>${ico("chevron-right")}When is this needed?</summary>
           <p class="body" style="text-align:left">TVs this app already knows are checked
             on every page load, and once when the app starts. Looking is for a TV it has
             never been told about. Forgetting one drops its address, but keeps its
             credentials, so looking again finds it already paired.</p>
         </details>
       </div>`;

  $("airplay").querySelectorAll("[data-pair]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    setLabel(b, "Asking\u2026");
    await pairPost({action: "begin", host: b.dataset.pair});
  });

  // Forgetting removes the address but keeps the credentials, so a later sweep finds
  // the TV already paired.
  $("airplay").querySelectorAll("[data-forget]").forEach(b =>
    b.onclick = () => arm(b, "Forget?", async () => {
      b.disabled = true;
      setLabel(b, "Forgetting\u2026");
      pairError = "";
      let res = {};
      try {
        res = await (await fetch("/api/airplay/forget", {method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({receiver: b.dataset.forget})})).json();
      } catch (e) { res = {error: String(e)}; }
      if (res.error) pairError = res.error;
      else airplayReceivers = res.receivers || [];
      renderAirplay();
      loadStreams();      // each stream's button for this receiver is gone
    }));

  const ok = $("pinOk"), no = $("pinNo"), pin = $("pin");
  if (pin) { pin.value = typed; if (!$("tvsView").hidden) pin.focus(); }
  if (ok) ok.onclick = async () => {
    ok.disabled = true;
    setLabel(ok, "Pairing\u2026");
    await pairPost({action: "finish", pin: pin.value});
  };
  if (pin) pin.onkeydown = (ev) => { if (ev.key === "Enter" && ok) ok.click(); };
  if (no) no.onclick = () => pairPost({action: "cancel"});

  $("apscan").onclick = async () => {
    // A tap on the icon makes ev.target the <svg>, which cannot be disabled, so look
    // the button up by name.
    const button = $("apscan");
    button.disabled = true;
    setLabel(button, "Looking\u2026");
    pairError = "";
    await refreshAirplay(true);
  };
}

async function pairPost(body) {
  pairError = "";
  let res = {};
  try {
    res = await (await fetch("/api/airplay/pair", {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)})).json();
  } catch (e) { res = {error: String(e)}; }
  if (res.error) pairError = res.error;
  await refreshAirplay();
  loadStreams();          // a newly paired receiver adds a button to every stream
}

let airplayAvailable = false;
let airplayReceivers = [];
let airplaySessions = {};
let airplayPairing = null;
let pairError = "";
let lastResult = null;

// Focus the field only with a mouse. On a phone it opened a keyboard over half the
// page on every load, and phone users often come to stop a stream or pair a TV.
// The last resolved URL is restored, because people usually return when a stream has
// timed out. It is selected, so pasting a new one replaces it.
const lastUrl = remembered("url");
if (lastUrl && !$("url").value) $("url").value = lastUrl;
syncClear();
$("url").addEventListener("focus", () => {
  if (lastUrl && $("url").value === lastUrl) {
    // iOS places the caret after the focus event, so select after it.
    setTimeout(() => $("url").setSelectionRange(0, $("url").value.length), 0);
  }
});
route();
if (matchMedia("(pointer: fine)").matches && $("tvsView").hidden) $("url").focus();

// Where upstream fetches leave from. Shown on the page, not only in the log, because
// otherwise the viewer cannot tell whether the origin sees their tunnel, and a tunnel
// that has stopped looks the same as one that works.
//
// A failure is checked again every EGRESS_RECHECK ms. The usual cause is a VPN still
// connecting after a restart, and a page that asked once kept showing the error after
// the tunnel came up.
const EGRESS_RECHECK = 15000;
let egressTimer = null;

function checkEgress() {
  clearTimeout(egressTimer);
  return fetch("/api/egress").then(r => r.json()).then(showEgress)
    .catch(() => { egressTimer = setTimeout(checkEgress, EGRESS_RECHECK); });
}

function showEgress(e) {
  const el = $("egress");
  if (!e || !e.enabled) return;
  el.hidden = false;
  if (e.error) {
    el.className = "warn";
    el.innerHTML = withIcon("exclamation-triangle",
      `The privacy proxy ${e.proxy} is not answering yet (${e.error}). If the VPN has `
      + "just started it may still be connecting; this checks again every 15 seconds. "
      + "Nothing will be found until it answers.");
    egressTimer = setTimeout(checkEgress, EGRESS_RECHECK);
    return;
  }
  el.className = "note";
  el.innerHTML = withIcon("globe-alt",
    `Sites see ${e.ip || "the privacy proxy's address"}, not yours.`
    + (e.forced ? "" : " A video that needs no fixing is still fetched by the TV itself."));
  el.title = "Upstream via " + e.proxy;
}

Promise.allSettled([
  checkEgress(),
  // No sweep on load. Named receivers are a few cached unicast probes; sweeping the
  // /24 (254 probes) is left to the button on the TVs screen.
  refreshAirplay(false),
]).then(loadStreams);
setInterval(loadStreams, 10000);
// Refresh when the page becomes visible, so a phone shows current streams instead of
// ones up to ten seconds old.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") loadStreams();
});
</script>
</html>
