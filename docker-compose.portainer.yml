# Portainer stack, bridge networking. Point a Repository stack at this path.
#
# Portainer CE git stacks take a single compose path, so they cannot run
# `docker compose -f docker-compose.yml -f docker-compose.bridge.yml`. This file is
# those two merged. Edit this one for Portainer; the other two are for the command line.
#
# Bridge instead of host because host mode was only needed for the AirPlay timing
# callback, which is pinned and published as UDP here. Two things must then be set:
# PWS_ADVERTISE_IP, because inside the container the app only sees the docker bridge,
# and the whole proxy port range, because each stream takes the next free port at
# runtime.
#
# Set PWS_ADVERTISE_IP in Portainer's environment variables when you add the stack.
# It has no default because a wrong value gives URLs a TV cannot fetch, which looks
# like a broken stream instead of a misconfiguration.
#
# The VPN sidecar at the bottom only starts if COMPOSE_PROFILES=vpn is also set there,
# so a stack without it deploys as before. The variables for both, in the same place:
#
#   COMPOSE_PROFILES=vpn
#   VPN_PROVIDER=nordvpn                 (any gluetun provider; nordvpn if unset)
#   VPN_PRIVATE_KEY=<your provider's wireguard key; see docker-compose.vpn.yml>
#   VPN_COUNTRIES=<the country you are in>
#   PWS_EGRESS_PROXY=http://gluetun:8888
#
# If you set the proxy but forget the profile, the address points at a container that
# never started, every upstream fetch fails, and the app reports it. Nothing falls back
# to fetching from this network, but it looks like a broken deploy.

name: play-web-stream

services:
  play-web-stream:
    build: .
    container_name: play-web-stream
    # Chromium's sandbox is off in the container (see CHROMIUM_NO_SANDBOX in the
    # Dockerfile). Turning it on would mean giving back the user namespaces Docker's
    # seccomp profile withholds, loosening the outer boundary. These settings tighten
    # it instead: no privilege escalation, no capabilities, and nothing writable except
    # the paths that must be. The fallback resolver drives a real browser over
    # arbitrary pages, so this matters.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      # Chromium's profile and the proxies' state files. Those name a token and a pid,
      # so they are written 0600 into a directory only this user owns.
      - /tmp:size=256m,mode=1777
      # $HOME. Chromium writes caches and crash dumps here regardless of its flags.
      - /home/app:size=64m,mode=1777
    pids_limit: 512
    # Caps a runaway before it takes the host down. Kept loose because an OOM kill
    # takes the whole container; raise it if many streams plus the browser get close.
    mem_limit: 2g
    restart: unless-stopped
    shm_size: 256m          # chromium crashes on the default 64m
    ports:
      - "${PWS_PORT:-8786}:${PWS_PORT:-8786}"
      # Four streams at once, more than a household needs. Each published port costs a
      # docker-proxy process and must be free for the container to start, so publish
      # only as many as you want simultaneous streams, not the twenty the proxy would
      # search. PWS_PROXY_PORT_LAST is passed to the app too, so it can show and
      # enforce the limit instead of failing a stream that runs past it.
      - "${PWS_PROXY_PORT:-8787}-${PWS_PROXY_PORT_LAST:-8790}:${PWS_PROXY_PORT:-8787}-${PWS_PROXY_PORT_LAST:-8790}"
      # AirPlay's timing callback. The receiver connects back on it, so it must be
      # reachable from the LAN. pyatv would otherwise bind an ephemeral port, which is
      # why AirPlay seems to need host networking.
      - "${PWS_AIRPLAY_TIMING_PORT:-49170}:${PWS_AIRPLAY_TIMING_PORT:-49170}/udp"
    volumes:
      - pyatv:/config           # AirPlay credentials and remembered receivers,
                                #   so each receiver is found and paired once
    environment:
      PWS_PORT: "${PWS_PORT:-8786}"
      PWS_PROXY_PORT: "${PWS_PROXY_PORT:-8787}"
      # Must match the range published above. The app enforces it, so a stream beyond
      # the range is refused with a reason instead of served on an unpublished port.
      PWS_PROXY_PORT_LAST: "${PWS_PROXY_PORT_LAST:-8790}"
      PWS_ADVERTISE_IP: "${PWS_ADVERTISE_IP:?set it to the LAN address of the machine running this stack}"
      PWS_AIRPLAY_TIMING_PORT: "${PWS_AIRPLAY_TIMING_PORT:-49170}"
      # PTP, then NTP if the receiver refuses it. tvOS 26.5 and later ignore NTP.
      PWS_AIRPLAY_TIMING: "${PWS_AIRPLAY_TIMING:-auto}"
      # Receiver addresses, comma-separated. Optional and rarely needed: the AirPlay
      # card sweeps this /24, pairs with what it finds, and saves the addresses to
      # /config, so the sweep happens once. An address set here is pinned and the card
      # cannot forget it.
      PWS_AIRPLAY_HOST: "${PWS_AIRPLAY_HOST:-}"
      # Hostnames this app answers to, comma-separated. Leave empty unless you reach
      # it by name. Someone else's DNS can repoint a name at us but not an address.
      # See SECURITY.md.
      PWS_ALLOW_HOSTS: "${PWS_ALLOW_HOSTS:-}"
      # PWS_WINDOW: "12"         # segments to advertise; raise if a stream stalls
      # Empty unless set in Portainer. When set, every upstream fetch (playlist,
      # segments, the headless browser's page load) goes through the sidecar below, so
      # origins see its address instead of this connection's. Use the service name,
      # not 127.0.0.1: under bridge networking the app is not on the host's loopback,
      # and the proxy is not published anywhere.
      PWS_EGRESS_PROXY: "${PWS_EGRESS_PROXY:-}"

  # The tunnel runs as a sidecar. The app is not placed inside its network because the
  # app is fetched from as well as fetching: Safari asks it for segments and an Apple
  # TV connects to it directly. It needs a LAN address and must answer on the LAN,
  # and network_mode: service:gluetun would remove that. Traffic is split by
  # destination instead: origins through the proxy, this network direct. See README,
  # "Keep your address private".
  gluetun:
    image: qmcgaw/gluetun:v3.40.0
    container_name: play-web-stream-vpn
    # Only starts with COMPOSE_PROFILES=vpn, so one file serves stacks with and
    # without a VPN.
    profiles: [vpn]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # No ports. The app reaches the proxy as gluetun:8888 over the stack's network.
    # An HTTP proxy on the LAN would be an open relay for anyone on it, and this one
    # exits through a VPN.
    environment:
      VPN_SERVICE_PROVIDER: "${VPN_PROVIDER:-nordvpn}"
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: "${VPN_PRIVATE_KEY:?set it in Portainer -- see the header}"
      SERVER_COUNTRIES: "${VPN_COUNTRIES:-}"
      HTTPPROXY: "on"
      HTTPPROXY_LISTENING_ADDRESS: ":8888"
      # Gluetun resolves DNS over the tunnel, so lookups for origins do not go to the
      # household resolver and reveal what is being watched.
      DOT: "on"
    restart: unless-stopped

volumes:
  pyatv:
