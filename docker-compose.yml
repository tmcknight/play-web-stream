# Deploy as a Portainer stack (Stacks -> Add stack -> Repository, or paste this in).
#
# Host networking is the default. For HLS, AirPlay does not restream: Safari hands the
# media URL to the Apple TV, which fetches it itself. That URL has to carry a LAN
# address, and under bridge networking the container only knows its docker bridge
# address.

name: play-web-stream

services:
  play-web-stream:
    build: .
    # Or, once it is pushed:
    # image: ghcr.io/tmcknight/play-web-stream:latest
    container_name: play-web-stream
    network_mode: host
    # Chromium's sandbox is off in the container (see CHROMIUM_NO_SANDBOX in the
    # Dockerfile). Turning it on would mean giving back the user namespaces Docker's
    # seccomp profile withholds, loosening the outer boundary. These settings tighten
    # it instead: no privilege escalation, no capabilities, and nothing writable except
    # the paths that must be. The fallback resolver drives a real browser over
    # arbitrary pages, so this matters.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      # Chromium's profile and the proxies' state files. Those name a token and a pid,
      # so they are written 0600 into a directory only this user owns.
      - /tmp:size=256m,mode=1777
      # $HOME. Chromium writes caches and crash dumps here regardless of its flags.
      - /home/app:size=64m,mode=1777
    pids_limit: 512
    # Caps a runaway before it takes the host down. Kept loose because an OOM kill
    # takes the whole container; raise it if many streams plus the browser get close.
    mem_limit: 2g
    restart: unless-stopped
    shm_size: 256m          # chromium crashes on the default 64m
    volumes:
      - pyatv:/config           # AirPlay credentials and remembered receivers,
                                #   so each receiver is found and paired once
    environment:
      PWS_PORT: "8786"
      # PWS_WINDOW: "12"         # segments to advertise; raise if a stream stalls
      # PWS_ADVERTISE_IP: ""     # only needed with docker-compose.bridge.yml
      # Receiver addresses, comma-separated. Optional and rarely needed: the AirPlay
      # card sweeps this /24, pairs with what it finds, and saves the addresses to
      # /config, so the sweep happens once. An address set here is pinned and the card
      # cannot forget it.
      PWS_AIRPLAY_HOST: "${PWS_AIRPLAY_HOST:-}"
      # Hostnames this app answers to, comma-separated. Leave empty unless you reach
      # it by name. Someone else's DNS can repoint a name at us but not an address.
      # See SECURITY.md.
      PWS_ALLOW_HOSTS: "${PWS_ALLOW_HOSTS:-}"
      PWS_AIRPLAY_TIMING_PORT: "${PWS_AIRPLAY_TIMING_PORT:-49170}"
      # PTP, then NTP if the receiver refuses it. tvOS 26.5 and later ignore NTP.
      PWS_AIRPLAY_TIMING: "${PWS_AIRPLAY_TIMING:-auto}"
      # Send every upstream fetch through a proxy, so stream origins see its address
      # instead of this network's. docker-compose.vpn.yml sets up one on a VPN and
      # sets both of these, but any HTTP proxy works.
      # PWS_EGRESS_PROXY: "http://127.0.0.1:8888"
      # PWS_FORCE_PROXY: "1"     # defaults on whenever the above is set

volumes:
  pyatv:

